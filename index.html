// English dates inside data (activity times, reviews, chats) -> chosen language
const EN_D = D_SHORT.en, EN_M = M_SHORT.en;
function localDates(s){
  return s.replace(/\b(Sun|Mon|Tue|Wed|Thu|Fri|Sat) (\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,
      (all, d, n, mo) => S.lang === 'de' ? `${D_SHORT.de[EN_D.indexOf(d)]}, ${n}. ${M_SHORT.de[EN_M.indexOf(mo)]}` : `${D_SHORT[S.lang][EN_D.indexOf(d)]} ${n} ${M_SHORT[S.lang][EN_M.indexOf(mo)]}`)
    .replace(/\bToday\b/g, L('Vandaag','Aujourd’hui','Heute'));
}
function tr(s){
  if (S.lang === 'en' || !s) return s;
  const hit = TR[s];
  if (hit) return hit[S.lang];
  for (const [re, fn] of PATTERNS){ const m = s.match(re); if (m) return localDates(fn(m)); }
  return localDates(s);
}
function translateText(n){
  if (!n.parentElement || n.parentElement.closest('script,style,[data-notr]')) return;
  const raw = n.nodeValue, key = raw.replace(/\s+/g, ' ').trim();
  if (!key || !/[A-Za-z]/.test(key)) return;
  const v = tr(key);
  if (v !== key) n.nodeValue = (/^\s/.test(raw) ? ' ' : '') + v + (/\s$/.test(raw) ? ' ' : '');
}
function translateDom(root){
  if (!root || S.lang === 'en') return;
  if (root.nodeType === 3){ translateText(root); return; }
  if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  let n; while ((n = w.nextNode())) list.push(n);
  list.forEach(translateText);
  const attrs = el => ['placeholder','title','aria-label'].forEach(a => {
    const v = el.getAttribute(a); if (!v) return;
    const t = tr(v.replace(/\s+/g, ' ').trim()); if (t !== v) el.setAttribute(a, t);
  });
  if (root.hasAttribute && (root.hasAttribute('placeholder') || root.hasAttribute('title') || root.hasAttribute('aria-label'))) attrs(root);
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(attrs);
}
// anything added to the page (screens, pop-ups, toasts) gets translated before it's painted
new MutationObserver(muts => { if (S.lang === 'en') return; muts.forEach(m => m.addedNodes.forEach(translateDom)); })
  .observe(document.documentElement, { childList:true, subtree:true });
function langSelect(){
  return `<select class="lang-sel" data-change="lang" aria-label="Language">${LANGS.map(l => `<option value="${l}" ${S.lang === l ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('')}</select>`;
}
function setLang(l){
  S.lang = l;
  try { localStorage.setItem('wetruss-lang', l); } catch(e){}
  document.documentElement.lang = l;
  document.title = tr('we.TRUSS — The backbone of every event');
  closeModal(); render();
}

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dparts(ds){ const x = new Date(ds+'T12:00:00'); return { dow:D_SHORT[S.lang][x.getDay()], day:x.getDate(), mon:M_SHORT[S.lang][x.getMonth()], year:x.getFullYear() }; }
function fmtDate(ds){ const p = dparts(ds); return S.lang === 'de' ? `${p.dow}, ${p.day}. ${p.mon} ${p.year}` : `${p.dow} ${p.day} ${p.mon} ${p.year}`; }
function fmtShort(ds){ const p = dparts(ds); return S.lang === 'de' ? `${p.dow}, ${p.day}. ${p.mon}` : `${p.dow} ${p.day} ${p.mon}`; }
function daysUntil(ds){ return Math.round((new Date(ds+'T12:00:00') - DEMO_TODAY)/864e5); }
function nowStr(){ const n = new Date(); return 'Today · ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); }
function findEvent(id){ return EVENTS.find(e => e.id === id); }
function findParty(id){ for (const e of EVENTS){ const p = e.parties.find(x => x.id === id); if (p) return { e, p }; } return {}; }
function partyName(e,id){ const p = e.parties.find(x => x.id === id); return p ? p.name : id; }
function readiness(e){ return e.parties.length ? Math.round(e.parties.filter(p => p.status === 'confirmed').length / e.parties.length * 100) : 0; }

// a network contact booked for an event: added as "Waiting" until they confirm.
// extra = details already known (set time, load-in, fee) from the New event form.
function bookingParty(e, d, extra){
  extra = extra || {};
  const p = { id:e.id + '-' + d.id, name:d.name, sub:d.sub, user:d.user, status:'waiting', due:extra.due || '2026-12-02',
    issue:'Booking request sent — waiting for their reply.', contact:PROMOTER_CONTACT, fee:extra.fee || d.price, flash:true };
  if (d.kind === 'artist') Object.assign(p, { type:'artist', setTime:extra.time || 'To agree', stage:extra.stage || 'Main stage', arrival:'To agree', parking:'To agree', rider:[] });
  else Object.assign(p, { type:'supplier', loadIn:extra.time || 'To agree', loadOut:'To agree', soundcheck:'To agree', access:'To agree', equipment:[] });
  return p;
}
function countStatus(e,s){ return e.parties.filter(p => p.status === s).length; }
function ringColor(r){ return r >= 80 ? 'var(--acid)' : r >= 50 ? 'var(--cyan)' : 'var(--mag)'; }
function ring(r, big){ return `<div class="ring ${big?'big':''}" style="--p:${r};--c:${ringColor(r)}" title="Readiness: % of parties confirmed"><span>${r}%</span></div>`; }
function pill(status){ const s = STATUS[status]; return `<span class="pill ${s.cls}">${s.label}</span>`; }
function unreadUpdates(e,p){ return e.updates.filter(u => u.affects.includes(p.id) && !u.seenBy[p.id]); }
function myParties(role){ const out = []; EVENTS.forEach(e => e.parties.forEach(p => { if (p.user === role) out.push({ e, p }); })); return out.sort((a,b) => a.e.date.localeCompare(b.e.date)); }
function roleUnread(role){
  if (role === 'promoter') return EVENTS.reduce((n,e) => n + e.activity.filter(a => !a.read).length, 0) + msgUnread(role) + docsBadge(role);
  return myParties(role).reduce((n,x) => n + unreadUpdates(x.e, x.p).length, 0) + msgUnread(role) + docsBadge(role);
}
/* availability helpers */
// events can run over several days: date = first day, endDate = last day (optional)
function dayList(start, end){
  const out = [], d = new Date(start + 'T12:00:00'), stop = new Date((end && end > start ? end : start) + 'T12:00:00');
  while (d <= stop){ out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate() + 1); }
  return out;
}
function eventDays(e){ return dayList(e.date, e.endDate); }
function fmtWhen(e){ return e.endDate && e.endDate > e.date ? `${fmtShort(e.date)} – ${fmtDate(e.endDate)}` : fmtDate(e.date); }
function bookingOn(pid, date){ const d = profile(pid); return EVENTS.find(e => eventDays(e).includes(date) && e.parties.some(p => p.name === d.name)); }
// availability over a date range: booked or busy on any day = not available
function availRange(pid, start, end){
  const st = dayList(start, end).map(ds => availOn(pid, ds));
  if (st.includes('unknown')) return 'unknown';
  if (st.includes('booked')) return 'booked';
  if (st.includes('busy')) return 'busy';
  return st.includes('last') ? 'last' : 'free';
}
function availOn(pid, date){
  const d = profile(pid);
  if (!d || !d.onPlatform) return 'unknown';
  if (bookingOn(pid, date)) return 'booked';
  return (AVAIL[pid] || {})[date] || 'free';
}
const AV_LABEL = { free:'Available', last:'Last-minute OK', busy:'Busy', booked:'Booked', unknown:'No calendar yet' };
function isAvailable(s){ return s === 'free' || s === 'last'; }
function availPill(pid, date, end){
  const s = availRange(pid, date, end);
  const cls = s === 'free' ? 'ok' : s === 'last' ? 'last' : s === 'unknown' ? 'off' : 'bad';
  return `<span class="pill ${cls}" title="${fmtDate(date)}">${s === 'last' ? '⚡ ' : ''}${AV_LABEL[s]}</span>`;
}

/* messages helpers */
function profile(id){ return DIRECTORY.find(d => d.id === id); }
function profileByName(name){ return DIRECTORY.find(d => d.name === name); }
function myProfileId(role){ const d = DIRECTORY.find(x => x.user === role); return d ? d.id : null; }
// conversations visible to a role: the promoter sees all; an artist/supplier only their own
function convosFor(role){ return role === 'promoter' ? CONVOS : CONVOS.filter(c => c.with === myProfileId(role)); }
function isMine(role, m){ return role === 'promoter' ? m.from === 'me' : m.from === 'them'; }
function convoUnread(role, c){ return c.msgs.filter(m => !isMine(role, m) && !m.read).length; }
function msgUnread(role){ return convosFor(role).reduce((n,c) => n + convoUnread(role, c), 0); }
function lastMsg(c){ return c.msgs[c.msgs.length - 1]; }
function initials(name){ return name.replace(/[^A-Za-zÀ-ÿØø ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase() || name.slice(0,2).toUpperCase(); }
function openItems(events){
  const items = [];
  events.forEach(e => e.parties.forEach(p => { if (p.status !== 'confirmed') items.push({ e, p }); }));
  return items.sort((a,b) =>
    (a.p.status === 'problem' ? 0 : 1) - (b.p.status === 'problem' ? 0 : 1) ||
    daysUntil(a.p.due || a.e.date) - daysUntil(b.p.due || b.e.date));
}
function dueLabel(p,e){
  const ds = p.due || e.date, n = daysUntil(ds);
  if (n < 0) return { txt:`Overdue by ${-n} day${n===-1?'':'s'} · was due ${fmtShort(ds)}`, urgent:true };
  if (n === 0) return { txt:'Due today', urgent:true };
  if (n === 1) return { txt:'Due tomorrow · ' + fmtShort(ds), urgent:true };
  return { txt:`Due in ${n} days · ${fmtShort(ds)}`, urgent:n <= 3 };
}
function agreed(p){
  if (p.type === 'artist') return [ ['Set time',p.setTime], ['Stage',p.stage], ['Fee',p.fee], ['Arrival',p.arrival] ];
  if (p.type === 'supplier') return [ ['Load-in',p.loadIn], ['Soundcheck',p.soundcheck], ['Load-out',p.loadOut], ['Fee',p.fee] ];
  return p.info || [];
}
function daysToGo(e){ const n = daysUntil(e.date); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`; }

/* ratings helpers */
function artistScore(name){
  const r = REVIEWS[name] || [];
  if (!r.length) return { avg:0, count:0 };
  return { avg: r.reduce((n,x) => n + x.stars, 0) / r.length, count: r.length };
}
function starsHtml(n, cls){ return `<span class="stars ${cls||''}" aria-label="${n} out of 5 stars">${[1,2,3,4,5].map(i => `<i class="${i <= Math.round(n) ? 'on' : ''}">★</i>`).join('')}</span>`; }
function scoreChip(name){
  const s = artistScore(name);
  if (!s.count) return '<span class="score none">No ratings yet</span>';
  return `<span class="score" title="Average of ${s.count} rating${s.count>1?'s':''} from promoters"><b>★ ${s.avg.toFixed(1)}</b> · ${s.count} review${s.count>1?'s':''}</span>`;
}
function toRate(){ return PAST_EVENTS.reduce((n,pe) => n + pe.artists.filter(a => !a.rating).length, 0); }

function initReveal(){
  const els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold:.12 });
  els.forEach(e => io.observe(e));
}

  return !q || [d.name, d.sub, d.city, ...d.tags].join(' ').toLowerCase().includes(q);

/* ---------------- render ---------------- */
function render(){
  const app = $('#app');
  if (!S.role){
    app.innerHTML = S.page === 'login' ? loginView() : S.page === 'plans' ? plansView() : landingView();
    initReveal();
    return;
  }
  let body = '';
  const after = [];
  if (S.screen === 'network' && S.role === 'promoter'){
    body = networkView();
  } else if (S.screen === 'new-event' && S.role === 'promoter'){
    body = newEventView();
  } else if (S.screen === 'docs'){
    body = docsView();
    const role = S.role;
    after.push(() => docsFor(role).forEach(d => { if (d.unseen) d.unseen[role] = false; }));
  } else if (S.screen === 'messages'){
    body = messagesView();
    const role = S.role, list = convosFor(role);
    const active = list.find(c => c.id === S.id) || (role !== 'promoter' ? list[0] : null);
    // opening a conversation = its incoming messages are now read
    if (active) after.push(() => active.msgs.forEach(m => { if (!isMine(role, m)) m.read = true; }));
  } else if (S.role === 'promoter'){
    if (S.screen === 'event'){
      const e = findEvent(S.id);
      body = promoterEvent(e);
      after.push(() => { e.activity.forEach(a => a.read = true); e.parties.forEach(p => p.flash = false); });
    } else body = promoterHome();
  } else {
    if (S.screen === 'mine'){
      const { e, p } = findParty(S.id);
      body = S.role === 'artist' ? artistGig(e,p) : supplierJob(e,p);
      // opening the gig/job counts as "seen" for all updates concerning this party
      after.push(() => { const t = nowStr(); unreadUpdates(e,p).forEach(u => u.seenBy[p.id] = t); });
    } else body = myHome(S.role);
  }
  after.forEach(f => f());          // mark as seen/read AFTER building the body (so NEW tags still show once)…
  app.innerHTML = header() + body;  // …but BEFORE the header, so its badge counts are already up to date
  const b = document.getElementById('bubbles'); if (b) b.scrollTop = b.scrollHeight;
}

function go(screen, id){ S.screen = screen; S.id = id || null; render(); window.scrollTo({ top:0 }); }

/* ---------------- toast & modal ---------------- */
function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = msg;
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }, 3200);
  setTimeout(() => el.remove(), 3700);
}

// promoter -> contact. Demo contacts without a login answer automatically after a moment;
// NØRA and LumenSound have their own demo login, so you reply by switching role.
function sendMessage(pid, text){
  let c = CONVOS.find(x => x.with === pid);
  if (!c){ c = { id:'c-' + pid, with:pid, msgs:[] }; CONVOS.unshift(c); }
  c.msgs.push({ from:'me', text, time:nowStr(), read:false });
  const d = profile(pid);
  if (d.user) return;
  c.typing = true;
  setTimeout(() => {
    c.typing = false;
    c.msgs.forEach(m => { if (m.from === 'me') m.read = true; });
    const reply = /book you|available/i.test(text)
      ? (d.kind === 'artist' ? `Thanks Lotte! Yes, I’m available on that date. Fee as on my profile (${d.price}). I’ll send my rider.` : `Hi Lotte, thanks! We’re free on that date. I’ll send you a quote today.`)
      : (d.kind === 'artist' ? 'Hi Lotte, thanks for your message! Happy to talk, what do you have in mind?' : 'Hi Lotte, thanks for reaching out. Send me the date and venue and I’ll make you a quote.');
    c.msgs.push({ from:'them', text:reply, time:nowStr(), read:false });
    // demo: saying yes to a booking or last-minute request confirms them in the event
    let confirmedIn = null;
    if (/book you|available/i.test(text)) EVENTS.forEach(e => e.parties.forEach(p => {
      if (p.name === d.name && p.status === 'waiting' && /request sent/i.test(p.issue || '')){
        p.status = 'confirmed'; p.issue = null; p.flash = true; confirmedIn = e;
        e.activity.unshift({ partyId:p.id, kind:'confirm', text:'confirmed they’ll be there.', time:nowStr(), read:false });
      }
    }));
    if (S.role === 'promoter' && (S.screen === 'messages' || (confirmedIn && S.screen === 'event' && S.id === confirmedIn.id))){
      const t = $('#msg-text'), u = $('#upd-text');           // keep anything being typed
      const draft = t ? t.value : '', upd = u ? u.value : '';
      render();
      if ($('#msg-text')) $('#msg-text').value = draft;
      if ($('#upd-text')) $('#upd-text').value = upd;
      if (S.screen !== 'messages' || S.id !== c.id) toast(confirmedIn ? `✓ ${esc(d.name)} confirmed for ${esc(confirmedIn.name)}.` : `💬 New message from ${esc(d.name)}.`, confirmedIn ? 'ok' : '');
    } else if (confirmedIn && S.role === 'promoter'){
      const h = document.querySelector('header.top'); if (h) h.outerHTML = header();
      toast(`✓ ${esc(d.name)} replied and confirmed for ${esc(confirmedIn.name)}.`, 'ok');
    } else {
      const h = document.querySelector('header.top'); if (h && S.role) h.outerHTML = header();   // update badges only
      toast(`💬 New message from ${esc(d.name)}.`);
    }
  }, 2200);
}

// candidates to replace a party with a problem: same kind, on we.TRUSS, not already in the event,
// available that day — last-minute people first, then best rated
function replacementCandidates(e, p){
  const kind = p.type === 'artist' ? 'artist' : 'supplier';
  const pool = DIRECTORY.filter(d => d.kind === kind && d.onPlatform && !e.parties.some(x => x.name === d.name));
  const ok = pool.filter(d => isAvailable(availRange(d.id, e.date, e.endDate)))
    .sort((a,b) => (availRange(b.id, e.date, e.endDate) === 'last') - (availRange(a.id, e.date, e.endDate) === 'last') || artistScore(b.name).avg - artistScore(a.name).avg);
  return { ok, hidden: pool.length - ok.length };
}
function openReplace(partyId){
  const { e, p } = findParty(partyId), { ok, hidden } = replacementCandidates(e, p);

const ACTIONS = {
  'add-payment'(){ S.trial.paid = true; render(); toast('✓ Payment method saved (demo) — nothing is charged until your free month ends.', 'ok'); },
  plans(r){ S.planRole = r; S.page = 'plans'; render(); window.scrollTo({ top:0 }); },
  'plan-pick'(key){
    const [r, plan] = key.split(':');
    S.plan = Object.assign({}, S.plan, { [r]:plan });
    if (r === 'promoter') S.trial = { start:null, plan };   // the free month starts with the first event; no payment yet
    ACTIONS.login(r);
    toast(r === 'promoter' ? '🎉 Welcome! Your free month starts with your first event.' : '🎉 Welcome to we.TRUSS — you’re on the Free plan.', 'ok');
  },
  login(id){
    const was = S.role;
    S.role = id; S.dash = {}; S.evTab = null; S.openParty = null; go('home');
  },
  // tiles: click opens that section, click again closes it
  dash(key){ const [role, tab] = key.split(':'); S.dash = S.dash || {}; S.dash[role] = S.dash[role] === tab ? null : tab; render(); },
  'ev-tab'(t){ S.evTab = t; render(); },
  'party-toggle'(id){ S.openParty = S.openParty === id ? null : id; render(); },
  switch(){ S.role = null; S.page = 'login'; S.screen = 'home'; render(); window.scrollTo({ top:0 }); },
  'to-login'(){ S.role = null; S.page = 'login'; render(); window.scrollTo({ top:0 }); },
  'to-landing'(){ S.role = null; S.page = 'landing'; render(); window.scrollTo({ top:0 }); },
  menu(){ document.querySelector('.lp-nav').classList.toggle('open'); },
  nav(id){
    if (S.page !== 'landing'){ S.page = 'landing'; render(); }
    const nav = document.querySelector('.lp-nav'); if (nav) nav.classList.remove('open');
    const el = document.getElementById('sec-' + id);
    if (!el || id === 'home') { window.scrollTo({ top:0, behavior:'smooth' }); return; }
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior:'smooth' });
  },
  reset(){ location.reload(); },
  home(){ go('home'); },
  'open-event'(id){ S.evTab = null; S.openParty = null; go('event', id); },
  'open-mine'(id){ go('mine', id); },
  jump(id){
    const { e } = findParty(id);
    S.evTab = 'parties'; S.openParty = id;
    if (S.screen !== 'event' || S.id !== e.id) go('event', e.id); else render();
    const el = document.getElementById('pc-' + id);
    if (el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  },
  tpl(i){
    const e = findEvent(S.id), t = e.templates[+i];
    $('#upd-text').value = tr(t.t);
    document.querySelectorAll('input[name=aff]').forEach(cb => cb.checked = t.sel.includes(cb.value));
  },
  selall(){
    const cbs = [...document.querySelectorAll('input[name=aff]')];
    const all = cbs.every(c => c.checked);
    cbs.forEach(c => c.checked = !all);
  },
  post(eid){
    const e = findEvent(eid);
    const text = $('#upd-text').value.trim();
    const affects = [...document.querySelectorAll('input[name=aff]:checked')].map(c => c.value);
    if (!text){ toast('✎ Write the change first (or tap a suggestion).', 'bad'); $('#upd-text').focus(); return; }
    if (!affects.length){ toast('☐ Select at least one party this affects.', 'bad'); return; }
    e.updates.unshift({ id:'u'+Date.now(), text, time:nowStr(), affects, seenBy:{} });
    render();
    toast(`📣 Update sent to ${affects.length} part${affects.length>1?'ies':'y'} — they get a notification in their own view.`, 'ok');
  },
  confirm(pid){
    const { e, p } = findParty(pid);
    p.status = 'confirmed'; p.issue = null; p.flash = true;
    if (p.equipment) p.equipment.forEach(q => q.flag = false);
    e.activity.unshift({ partyId:pid, kind:'confirm', text: p.type==='supplier' ? 'confirmed the job and equipment list.' : 'confirmed they’ll be there.', time:nowStr(), read:false });
    render();
    toast(`✓ Confirmed! ${USERS.promoter.first} (promoter) sees this right away.`, 'ok');
  },
  problem(pid){ openProblemModal(pid); },
  rate(key){ openRateModal(key); },

  /* ---- last-minute replacement ---- */
  replace(partyId){ openReplace(partyId); },
  'replace-book'(key){
    const [partyId, pid] = key.split('|'), { e, p } = findParty(partyId), d = profile(pid);
    const slot = p.type === 'artist' ? p.setTime : p.loadIn;
    const np = bookingParty(e, d, { time: slot, fee:'', due: e.date });
    np.issue = `Last-minute request sent — replacing ${p.name}.`;
    e.parties.push(np);
    p.replacedBy = d.name;
    p.issue = `${p.issue} → Replacement asked: ${d.name}.`;
    d.inNetwork = true;
    sendMessage(d.id, `Hi ${d.name}! Last-minute request: ${p.name} can’t make it to ${e.name} on ${fmtDate(e.date)} at ${e.venue}, ${e.city}. Could you take the ${p.type === 'artist' ? 'set' : 'job'}${slot ? ' (' + slot + ')' : ''}? Are you available?`);
    closeModal(); render();
    S.evTab = 'parties'; S.openParty = np.id; render();
    const el = document.getElementById('pc-' + np.id); if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
    toast(`⚡ Last-minute request sent to ${esc(d.name)}. They’re in ${esc(e.name)} as “Waiting”.`, 'ok');
  },

  /* ---- availability ---- */
  'cal-day'(ds){
    const pid = myProfileId(S.role); if (!pid) return;
    const cal = AVAIL[pid] = AVAIL[pid] || {};
    const next = { free:'busy', busy:'last', last:'free' }[cal[ds] || 'free'];
    if (next === 'free') delete cal[ds]; else cal[ds] = next;
    render();
  },
  'cal-month'(step){
    const [y, m] = (S.calM || '2026-12').split('-').map(Number), d = new Date(y, m - 1 + (+step), 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}`;
    if (ym >= CAL_MIN && ym <= CAL_MAX){ S.calM = ym; render(); }
  },

  /* ---- new event ---- */
  'new-event'(){ go('new-event'); },
  'create-event'(){
    const v = id => ($('#' + id).value || '').trim();
    const name = v('ne-name'), kind = v('ne-kind'), cap = v('ne-cap'), desc = v('ne-desc'), date = v('ne-date'),
          doors = v('ne-doors'), end = v('ne-end'), due = v('ne-due'), venue = v('ne-venue'), city = v('ne-city'),
          addr = v('ne-addr'), ticket = v('ne-ticket'), venueOk = $('#ne-venue-ok').checked;
    const need = [['ne-name', name, 'an event name'], ['ne-cap', cap, 'the capacity'], ['ne-date', date, 'the date'],
                  ['ne-doors', doors, 'the doors time'], ['ne-venue', venue, 'the venue'], ['ne-city', city, 'the city']];
    const miss = need.find(([, val]) => !val);
    if (miss){ toast(`Add ${miss[2]} first.`, 'bad'); $('#' + miss[0]).focus(); return; }
    if (date < '2026-11-25'){ toast('Pick a date in the future.', 'bad'); $('#ne-date').focus(); return; }
    const endDate = v('ne-date-end');
    if (endDate && endDate < date){ toast('The end date can’t be before the start date.', 'bad'); $('#ne-date-end').focus(); return; }
    if (!(+cap > 0)){ toast('Capacity should be a number, e.g. 450.', 'bad'); $('#ne-cap').focus(); return; }

    const e = { id:'e' + Date.now(), name, kind, date, endDate: endDate > date ? endDate : undefined, doors, hours:`${doors} – ${end || 'late'}`, venue, city,
                address: addr || city, capacity:+cap, ticket, desc, parties:[], updates:[], activity:[] };
    e.parties.push({ id:e.id + '-venue', type:'venue', name:venue, sub:`Venue · ${cap} capacity`,
      status: venueOk ? 'confirmed' : 'waiting', due: due || date, issue: venueOk ? null : 'Venue booking not confirmed yet.',
      info:[ ['Address', addr || '—'], ['Doors', doors], ['Ends', end || '—'], ['Capacity', cap], ...(ticket ? [['Tickets', ticket]] : []) ] });

    const booked = [...document.querySelectorAll('input[name=ne-book]:checked')].map(c => profile(c.value));
    booked.forEach(d => {
      const time = (document.querySelector(`[data-ne-time="${d.id}"]`).value || '').trim();
      const fee  = (document.querySelector(`[data-ne-fee="${d.id}"]`).value || '').trim();
      e.parties.push(bookingParty(e, d, { time, fee, due: due || undefined }));
      const detail = [time && (d.kind === 'artist' ? `set time ${time}` : `load-in ${time}`), fee && `fee ${fee}`].filter(Boolean).join(', ');
      sendMessage(d.id, `Hi ${d.name}! I’d like to book you for ${name} (${kind.toLowerCase()}) on ${fmtWhen(e)} at ${venue}, ${city}.${detail ? ' Proposal: ' + detail + '.' : ''} Are you available?`);
    });

    const ids = t => e.parties.filter(p => t.includes(p.type)).map(p => p.id);
    e.templates = [
      { t:'Doors open 30 minutes later than planned', sel: e.parties.map(p => p.id) },
      { t:'Set times are now final', sel: ids(['artist']) },
      { t:'Load-in starts one hour earlier', sel: ids(['supplier','venue']) }
    ];
    EVENTS.push(e);
    EVENTS.sort((a,b) => a.date.localeCompare(b.date));
    const trialStarts = S.trial && !S.trial.start;
    if (trialStarts) S.trial.start = '2026-11-25';
    go('event', e.id);
    if (trialStarts) setTimeout(() => toast('🎁 Your free month has started — enjoy we.TRUSS!', 'ok'), 600);
    toast(`🎉 ${esc(name)} created${booked.length ? ` · booking request sent to ${booked.length} ${booked.length > 1 ? 'people' : 'person'}` : ''}.`, 'ok');
  },

  /* ---- network ---- */
  network(){ S.id = null; go('network'); },
  'net-filter'(f){ S.netF = f; render(); },
  'net-date-clear'(){ S.netDate = null; if (S.netF === 'avail') S.netF = 'all'; render(); },
  'net-add'(pid){
    const d = profile(pid); d.inNetwork = true; render();
    toast(`✓ ${esc(d.name)} added to your network.`, 'ok');
  },
  'event-invite'(pid){ openEventInvite(pid); },
  'send-event-invite'(pid){
    const d = profile(pid), sel = document.querySelector('input[name=inv-ev]:checked');
    if (!sel){ toast('Pick an event first.', 'bad'); return; }
    const e = findEvent(sel.value), note = $('#inv-msg').value.trim();
    e.parties.push(bookingParty(e, d));
    d.inNetwork = true;
    sendMessage(d.id, `Hi ${d.name}! I’d like to book you for ${e.name} on ${fmtDate(e.date)} at ${e.venue}, ${e.city}. Are you available?` + (note ? ' ' + note : ''));
    closeModal(); render();
    toast(`📩 Booking request sent to ${esc(d.name)}. They’re now in ${esc(e.name)} as “Waiting”.`, 'ok');
  },
  'platform-invite'(pid){ openPlatformInvite(pid); },
  'new-invite'(){ openPlatformInvite(null); },
  'send-platform-invite'(pid){
    let d = pid ? profile(pid) : null;
    const contact = $('#inv-contact').value.trim();
    if (!d){
      const name = $('#inv-name').value.trim(), sub = $('#inv-sub').value.trim();
      const kind = (document.querySelector('input[name=inv-kind]:checked') || {}).value || 'artist';
      if (!name){ toast('Add their name first.', 'bad'); $('#inv-name').focus(); return; }
      if (!contact){ toast('Add an email or phone number.', 'bad'); $('#inv-contact').focus(); return; }
      d = { id:'new' + Date.now(), kind, name, sub: sub || (kind === 'artist' ? 'Artist' : 'Supplier'), city:'Belgium', price:'To agree', tags:['New'], inNetwork:false, onPlatform:false };
      DIRECTORY.unshift(d);
    } else if (!contact){ toast('Add an email or phone number.', 'bad'); return; }
    d.invited = true;
    closeModal(); S.netF = 'all'; S.netQ = ''; render();
    toast(`✉ Invite sent to ${esc(d.name)}.`, 'ok');
    // demo: they accept the invite a few seconds later
    setTimeout(() => {
      d.onPlatform = true; d.inNetwork = true; d.invited = false;
      if (S.role === 'promoter' && S.screen === 'network') render();
      toast(`🎉 ${esc(d.name)} joined we.TRUSS and is now in your network. You can message them.`, 'ok');
    }, 4500);
  },

  /* ---- messages ---- */
  'social-soon'(label){ toast(`${label}: coming soon — we’re setting up our account.`); },
  docs(){ go('docs'); },
  'doc-filter'(f){ S.docF = f; render(); },
  'doc-open'(id){ openContract(id); },
  'doc-print'(){ document.body.classList.add('print-doc'); window.print(); },
  'doc-sign'(id){
    const d = DOCS.find(x => x.id === id), { e, p } = findParty(d.pid);
    d.status = 'signed'; d.signed = '2026-11-25';
    notifyDoc(d, 'promoter');
    e.activity.unshift({ partyId:p.id, kind:'confirm', text:'signed the contract.', time:nowStr(), read:false });
    closeModal(); render(); toast('✓ Contract signed — Lotte sees it right away.', 'ok');
  },
  'doc-send'(id){
    const d = DOCS.find(x => x.id === id), p = docParty(d);
    const app = sendContract(d); render();
    toast(app ? `✓ Shared with ${esc(p.name)} — they get a notification.` : `✉ ${esc(p.name)} isn’t on we.TRUSS yet — it goes out by email.`, 'ok');
  },
  'doc-remind'(id){ const p = docParty(DOCS.find(x => x.id === id)); toast(`Reminder sent to ${esc(p.name)}.`); },
  'doc-file'(id){ const d = DOCS.find(x => x.id === id); if (d.url) window.open(d.url, '_blank'); else toast('Demo file — there’s no real document behind it.'); },
  'doc-upload'(){ openUploadModal(); },
  'doc-upload-submit'(){
    const f = $('#up-file').files[0];
    if (!f){ toast('Choose a file first.'); return; }
    const [eid, pid, priv] = $('#up-to').value.split('|'), role = S.role;
    const size = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1024)) + ' KB';
    const d = { id:'u' + Date.now(), kind:'file', eid:eid || null, pid:pid || null, private:priv === '1', owner:role, by:role,
                name:f.name, size, date:'2026-11-25', url:URL.createObjectURL(f) };
    DOCS.push(d);
    closeModal(); S.docF = 'all';
    if (d.private){ render(); toast('🔒 Saved privately — only you can see it.', 'ok'); return; }
    const { e, p } = findParty(pid);
    if (role === 'promoter'){
      if (p.user){
        notifyDoc(d, p.user);
        e.updates.unshift({ id:'u' + Date.now(), text:'New document from Lotte — you’ll find it under Documents.', time:nowStr(), affects:[p.id], seenBy:{} });
      }
      render();
      toast(p.user ? `✓ Shared with ${esc(p.name)} — they get a notification.` : `✉ ${esc(p.name)} isn’t on we.TRUSS yet — it goes out by email.`, 'ok');
    } else {
      notifyDoc(d, 'promoter');
      e.activity.unshift({ partyId:p.id, kind:'confirm', text:'shared a document.', time:nowStr(), read:false });
      render(); toast('✓ Shared with Lotte — she gets a notification.', 'ok');
    }
  },
  'new-contract'(){ openNewContract(); },
  'nc-create'(mode){
    const e = findEvent($('#nc-event').value);
    const ids = [...document.querySelectorAll('input[name=nc]:checked')].map(c => c.value);
    if (!ids.length){ toast('☐ Select at least one person.', 'bad'); return; }
    const offline = [];
    ids.forEach(pid => {
      const d = { id:'k-' + pid, kind:'contract', eid:e.id, pid, status:'draft', date:'2026-11-25', signed:null };
      DOCS.push(d);
      if (mode === 'send' && !sendContract(d)) offline.push(e.parties.find(x => x.id === pid).name);
    });
    closeModal(); S.docF = 'all'; render();
    if (mode !== 'send'){ toast('✓ Drafts saved — only you can see them until you send them.', 'ok'); return; }
    toast('📄 Contracts sent — they get a notification and find them under Documents.', 'ok');
    if (offline.length) toast(`✉ ${esc(offline.join(', '))} ${offline.length > 1 ? 'aren’t' : 'isn’t'} on we.TRUSS yet — it goes out by email.`);
  },
  messages(){ go('messages'); },
  message(pid){
    let c = CONVOS.find(x => x.with === pid);
    if (!c){ c = { id:'c-' + pid, with:pid, msgs:[] }; CONVOS.unshift(c); }
    go('messages', c.id);
    setTimeout(() => $('#msg-text') && $('#msg-text').focus(), 50);
  },
  'open-convo'(id){ go('messages', id); },
  'quick-msg'(text){ const t = $('#msg-text'); t.value = tr(text); t.focus(); },
  'send-msg'(cid){
    const text = $('#msg-text').value.trim();
    if (!text){ toast('✎ Write a message first.', 'bad'); $('#msg-text').focus(); return; }
    const c = CONVOS.find(x => x.id === cid);
    if (S.role === 'promoter') sendMessage(c.with, text);
    else { c.msgs.push({ from:'them', text, time:nowStr(), read:false }); }
    S.id = c.id; render();
  },
  'rate-star'(n){
    S.rateStars = +n;
    const words = ['', 'Poor', 'Below expectations', 'OK', 'Good', 'Excellent'];
    document.querySelectorAll('.stars-in button').forEach((b,i) => b.classList.toggle('on', i < S.rateStars));
    $('#stars-lbl').textContent = `${S.rateStars}/5 · ${tr(words[S.rateStars])}`;
  },
  'submit-rate'(key){
    if (!S.rateStars){ toast('★ Pick 1 to 5 stars first.', 'bad'); return; }
    const [peId, idx] = key.split(':'), pe = PAST_EVENTS.find(x => x.id === peId), a = pe.artists[+idx];
    const tags = [...document.querySelectorAll('input[name=rtag]:checked')].map(c => c.value);
    const note = $('#rate-note').value.trim();
    a.rating = { stars:S.rateStars, tags, note, date:'Today' };
    (REVIEWS[a.name] = REVIEWS[a.name] || []).unshift({ stars:S.rateStars, by:'Nachtwerk Collective', date:'Today', tags, note, fresh:true });
    closeModal(); render();
    const s = artistScore(a.name);
    toast(`★ Rating saved. ${esc(a.name)} now has ★ ${s.avg.toFixed(1)} from ${s.count} review${s.count>1?'s':''}.`, 'ok');
  },
  'close-modal'(){ closeModal(); },
  'submit-problem'(pid){
    const { e, p } = findParty(pid);
    const kind = (document.querySelector('input[name=ptype]:checked') || {}).value || 'Problem';
    const details = $('#prob-text').value.trim();
    const itemSel = $('#prob-item');
    let itemTxt = '';
    if (itemSel && itemSel.value !== ''){ const q = p.equipment[+itemSel.value]; q.flag = true; itemTxt = `${q.qty}× ${q.item}`; }
    const text = kind + (itemTxt ? ': ' + itemTxt : '') + (details ? ' — ' + details : '');
    p.status = 'problem'; p.issue = text; p.flash = true;
    e.activity.unshift({ partyId:pid, kind:'problem', text:'reported a problem: ' + text, time:nowStr(), read:false });
    closeModal(); render();
    toast(`⚠ Sent to ${USERS.promoter.first}. The promoter’s view is updated.`, 'bad');
  }
};

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  // clicks inside the modal shouldn't close it (only the backdrop itself)
  if (a === 'close-modal' && t.classList.contains('modal-bg') && ev.target !== t) return;
  if (ACTIONS[a]){ ev.preventDefault(); ACTIONS[a](t.dataset.id, t, ev); }
});
window.addEventListener('afterprint', () => document.body.classList.remove('print-doc'));
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.change === 'lang'){ setLang(t.value); return; }
  if (t.dataset.change === 'nc-event'){ openNewContract(t.value); return; }
  if (t.dataset.change === 'status' && t.value){
    const { p } = findParty(t.dataset.id);
    p.status = t.value;
    if (t.value === 'confirmed'){ p.issue = null; if (p.equipment) p.equipment.forEach(q => q.flag = false); }
    else if (!p.issue) p.issue = t.value === 'problem' ? 'Marked as a problem by the promoter.' : 'Waiting for confirmation.';
    render();
    toast(`Status of ${esc(p.name)} set to ${STATUS[t.value].label}.`);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeModal();
  // Enter sends a chat message (Shift+Enter = new line)
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'msg-text'){
    ev.preventDefault();
    const b = document.querySelector('[data-act=send-msg]'); if (b) b.click();
  }
});
// live search on the Network page (filters the cards without re-rendering, so typing isn't interrupted)
document.addEventListener('input', ev => {
  // New event form: show who is free on the chosen date
  // New event form: dates changed -> show only who's free, keep what was already ticked/typed
  if (ev.target.id === 'ne-date' || ev.target.id === 'ne-date-end'){
    const start = $('#ne-date').value, end = $('#ne-date-end').value;
    if (ev.target.id === 'ne-date' && start) $('#ne-date-end').min = start;
    const keep = {};
    document.querySelectorAll('input[name=ne-book]').forEach(cb => {
      keep[cb.value] = { on: cb.checked, time: document.querySelector(`[data-ne-time="${cb.value}"]`).value, fee: document.querySelector(`[data-ne-fee="${cb.value}"]`).value };
    });
    $('#ne-pool').innerHTML = nePool(start, end && end >= start ? end : '');
    Object.entries(keep).forEach(([id, k]) => {
      const cb = document.querySelector(`input[name=ne-book][value="${id}"]`); if (!cb) return;
      cb.checked = k.on; document.querySelector(`[data-ne-time="${id}"]`).value = k.time; document.querySelector(`[data-ne-fee="${id}"]`).value = k.fee;
    });
    return;
  }
  // Network: availability for an event or a date
  if (ev.target.id === 'net-date' || ev.target.id === 'net-date-ev'){
    S.netDate = ev.target.value || null;
    if (!S.netDate && S.netF === 'avail') S.netF = 'all';
    render();
    return;
  }
  if (ev.target.id !== 'net-q') return;
  S.netQ = ev.target.value;
  document.querySelectorAll('.net-card').forEach(el => el.classList.toggle('hide', !netMatches(profile(el.dataset.id))));
  const empty = document.querySelector('.net-empty'); if (empty) empty.classList.toggle('hide', DIRECTORY.some(netMatches));
});

document.documentElement.lang = S.lang;
document.title = tr('we.TRUSS — The backbone of every event');
render();
</script>
</body>
</html>
