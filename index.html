<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>we.TRUSS — The backbone of every event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14111a;
  --panel:#1f1b27;--inset:#17141e;
  --panel2:#27222f;
  --line:#342d40;
  --line2:#463d55;
  --text:#ffffff;
  --muted:#cfc7d9;
  --dim:#a197ae;
  --cyan:#a78bfa;
  --mag:#ff7a6b;
  --acid:#5eead4;
  --amber:#ffc857;
  --red:#ff4d6d;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 420px at 0% -10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(800px 420px at 100% 0%, rgba(255,122,107,.15), transparent 60%);
}
#app{position:relative;z-index:1}
button{font-family:inherit;cursor:pointer}
a{color:var(--cyan)}
.mono{font-family:var(--mono);font-feature-settings:"zero" 1}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* ---------- Buttons ---------- */
.btn{
  --c:var(--cyan);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:12px;
  border:1px solid var(--c);color:var(--c);
  background:color-mix(in srgb,var(--c) 8%,transparent);
  font-weight:700;font-size:14px;letter-spacing:.01em;
  box-shadow:0 0 0 0 transparent,0 0 14px color-mix(in srgb,var(--c) 28%,transparent);
  transition:transform .08s ease,box-shadow .2s ease,background .2s ease;
  text-decoration:none;white-space:nowrap;
}
.btn:hover{background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--c);color:#000;box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent)}
.btn.solid:hover{box-shadow:0 0 34px color-mix(in srgb,var(--c) 80%,transparent)}
.btn.mag{--c:var(--mag)} .btn.acid{--c:var(--acid)} .btn.red{--c:var(--red)} .btn.ghost{--c:var(--muted);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn.huge{width:100%;padding:20px 18px;font-size:18px;border-radius:16px}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;color:var(--cyan);font-weight:600;padding:0;font-size:13px}
.back{background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:18px 0 4px;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--cyan)}

/* ---------- Badges / pills ---------- */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:var(--mag);color:#000;font:700 11px/1 var(--mono);
  box-shadow:0 0 10px var(--mag),0 0 22px rgba(255,122,107,.55);
  animation:pulse 1.8s ease-in-out infinite;
}
.badge.cyan{background:var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 22px rgba(167,139,250,.5)}
@keyframes pulse{50%{box-shadow:0 0 4px var(--mag),0 0 10px rgba(255,122,107,.35)}}
.newtag{font:700 10px/1 var(--sans);letter-spacing:.12em;color:#000;background:var(--mag);padding:4px 6px;border-radius:5px;box-shadow:0 0 12px var(--mag)}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:4px 10px;border-radius:999px;border:1px solid;
  font:700 11px/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.ok{color:var(--acid);border-color:rgba(94,234,212,.45);background:rgba(94,234,212,.07)}
.pill.wait{color:var(--amber);border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.07)}
.pill.bad{color:var(--red);border-color:rgba(255,77,109,.55);background:rgba(255,77,109,.09);box-shadow:0 0 12px rgba(255,77,109,.25)}
.tag{display:inline-block;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);padding:5px 8px;border:1px solid rgba(167,139,250,.35);border-radius:6px}
.tag.mag{color:var(--mag);border-color:rgba(255,122,107,.4)}
.tag.acid{color:var(--acid);border-color:rgba(94,234,212,.4)}

/* ---------- Cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card h3 .count{margin-left:auto}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(26,22,33,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top::after{content:"";display:block;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--mag),var(--acid),transparent);opacity:.55}
.top-in{display:flex;align-items:center;gap:12px;height:64px}
.logo{background:none;border:0;color:var(--text);font:800 18px/1 var(--sans);letter-spacing:.18em;padding:0}
.logo i{font-style:normal;color:var(--mag);text-shadow:0 0 12px var(--mag)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line2);border-radius:999px}
.who b{display:block;font-size:13px;line-height:1.1}
.who small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--mono);color:#000}
.av.promoter{background:var(--cyan);box-shadow:0 0 14px rgba(167,139,250,.6)}
.av.artist{background:var(--mag);box-shadow:0 0 14px rgba(255,122,107,.6)}
.av.supplier{background:var(--acid);box-shadow:0 0 14px rgba(94,234,212,.55)}
.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--text);display:grid;place-items:center}
.bell:hover{border-color:var(--cyan)}
.bell .badge{position:absolute;top:-7px;right:-7px}
.rolebar{display:flex;gap:6px}
.rolebar button{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:10px;padding:6px 10px;font:600 12px var(--sans);display:inline-flex;align-items:center;gap:6px;position:relative}
.rolebar button.on{color:#000;border-color:transparent}
.rolebar button.on.promoter{background:var(--cyan)} .rolebar button.on.artist{background:var(--mag)} .rolebar button.on.supplier{background:var(--acid)}
.rolebar .badge{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;font-size:10px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center}
.brand-big{font:800 clamp(40px,9vw,84px)/1 var(--sans);letter-spacing:.14em;
  background:linear-gradient(90deg,var(--cyan),var(--mag) 55%,var(--acid));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,122,107,.35))}
.login .tagline{max-width:560px;color:var(--muted);font-size:17px;margin:18px auto 8px}
.login .eq{display:flex;gap:4px;justify-content:center;height:26px;align-items:flex-end;margin:18px 0 30px}
.login .eq i{display:block;width:5px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:eq 1s ease-in-out infinite}
.login .eq i:nth-child(3n){background:var(--mag);box-shadow:0 0 8px var(--mag)}
.login .eq i:nth-child(4n){background:var(--acid);box-shadow:0 0 8px var(--acid)}
@keyframes eq{0%,100%{height:5px}50%{height:26px}}
.role-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:980px}
.role-card{--c:var(--cyan);position:relative;text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:22px;color:var(--text);transition:all .2s ease;display:flex;flex-direction:column;gap:12px}
.role-card:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 32px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(-2px)}
.role-card.artist{--c:var(--mag)} .role-card.supplier{--c:var(--acid)}
.role-card .rname{font-size:24px;font-weight:800;color:var(--c);text-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}
.role-card .ruser{display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed var(--line2);border-radius:12px}
.role-card .ruser b{display:block;font-size:14px} .role-card .ruser small{color:var(--muted);font-size:12px}
.role-card p{margin:0;color:var(--muted);font-size:14px}
.role-card .go{margin-top:auto;font:700 13px var(--sans);color:var(--c);letter-spacing:.1em}
.role-card .badge{position:absolute;top:-9px;right:-9px;height:24px;min-width:24px;font-size:12px}
.login .foot{margin-top:28px;color:var(--dim);font-size:13px}

/* ---------- Dashboard ---------- */
.hello{padding:26px 0 4px}
.hello h1{font-size:clamp(24px,4vw,34px);font-weight:800}
.hello p{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .v{font:700 28px/1.1 var(--mono)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.ev-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ev-card{position:relative;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;transition:all .2s ease}
.ev-card:hover{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 28px rgba(167,139,250,.25);transform:translateY(-2px)}
.ev-card .badge{position:absolute;top:-9px;right:-9px;height:24px;min-width:24px;font-size:12px}
.ev-top{display:flex;gap:14px;align-items:flex-start}
.dateblock{flex:none;width:58px;border:1px solid var(--line2);border-radius:12px;text-align:center;padding:6px 0;background:var(--inset)}
.dateblock .d{font:700 24px/1 var(--mono);color:var(--cyan);text-shadow:0 0 12px rgba(167,139,250,.6)}
.dateblock .m{font:600 11px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ev-card .nm{font-size:18px;font-weight:800;line-height:1.25}
.ev-card .vn{color:var(--muted);font-size:13px}
.ev-mid{display:flex;align-items:center;gap:16px}
.ev-chips{display:flex;flex-wrap:wrap;gap:6px}
.ev-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.ring{--p:50;--c:var(--cyan);flex:none;width:74px;height:74px;border-radius:50%;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line2) 0);
  display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 45%,transparent))}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--inset)}
.ring span{position:relative;font:700 17px/1 var(--mono);color:var(--c)}
.ring.big{width:104px;height:104px} .ring.big::before{inset:9px} .ring.big span{font-size:24px}
.ringlbl{font-size:12px;color:var(--muted);line-height:1.35}
.ringlbl b{display:block;color:var(--text);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ---------- Open items ---------- */
.oi-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.oi{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--inset)}
.oi.bad{border-color:rgba(255,77,109,.45);box-shadow:inset 3px 0 0 var(--red)}
.oi.wait{box-shadow:inset 3px 0 0 var(--amber)}
.oi .rank{font:700 12px/1 var(--mono);color:var(--dim);width:18px;padding-top:4px;flex:none}
.oi .body{flex:1;min-width:0}
.oi .t{font-weight:700;font-size:14px}
.oi .t small{font-weight:500;color:var(--muted);margin-left:6px}
.oi p{margin:3px 0 4px;font-size:13px;color:#d6dae3}
.oi .due{font:600 11px/1.4 var(--mono);color:var(--muted)}
.oi .due.urgent{color:var(--red)}
.empty{padding:16px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:center;font-size:14px}

/* ---------- Event page ---------- */
.ev-hero{margin-top:6px;padding:22px;border-radius:22px;border:1px solid var(--line2);
  background:linear-gradient(135deg,rgba(167,139,250,.07),rgba(255,122,107,.06) 50%,rgba(94,234,212,.04)),var(--panel);
  display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ev-hero .info{flex:1;min-width:240px}
.ev-hero h1{font-size:clamp(26px,4.5vw,38px);font-weight:800;margin:10px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
.meta > span{display:inline-flex;align-items:center;gap:6px}
.meta b{color:var(--text);font-weight:600}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.count-box{border:1px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--inset);min-width:92px}
.count-box .v{font:700 22px/1 var(--mono)}
.count-box .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.ev-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:18px}
.parties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.party{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.party.ok{border-color:rgba(94,234,212,.22)}
.party.bad{border-color:rgba(255,77,109,.55);box-shadow:0 0 22px rgba(255,77,109,.16)}
.party.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 2px var(--cyan),0 0 40px rgba(167,139,250,.6)}100%{}}
.party-hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ptype{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.pname{font-size:17px;font-weight:800;margin-top:6px;line-height:1.2}
.psub{font-size:12px;color:var(--muted)}
.pstat{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pstat select{background:var(--inset);color:var(--muted);border:1px solid var(--line2);border-radius:8px;font:500 11px var(--sans);padding:3px 4px}
.issue{font-size:13px;padding:9px 11px;border-radius:10px;border:1px solid}
.issue.bad{color:#ffd0dc;border-color:rgba(255,77,109,.45);background:rgba(255,77,109,.08)}
.issue.wait{color:#fff0c2;border-color:rgba(255,200,87,.35);background:rgba(255,200,87,.06)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:13px;text-align:right;color:var(--text)}
.items{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.items li{display:flex;gap:8px;align-items:baseline}
.items .ic{flex:none;width:16px;font-family:var(--mono);font-weight:700}
.items .ic.yes{color:var(--acid)} .items .ic.pending{color:var(--amber)} .items .ic.no{color:var(--red)}
.items .q{font-family:var(--mono);color:var(--cyan);min-width:30px}
.items li.flag{color:var(--red)}
.items .lbl{font:600 10px var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.pfoot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.pfoot .acc{color:var(--mag)}

/* post box */
.post textarea,.modal textarea{width:100%;min-height:84px;resize:vertical;background:var(--inset);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:12px;font:15px/1.45 var(--sans);outline:none;transition:border-color .2s, box-shadow .2s}
.post textarea:focus,.modal textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(167,139,250,.15),0 0 18px rgba(167,139,250,.2)}
.tpls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tpl{background:transparent;border:1px dashed var(--line2);color:var(--muted);border-radius:999px;padding:5px 10px;font:500 12px var(--sans)}
.tpl:hover{border-color:var(--cyan);color:var(--cyan)}
.lblrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.chk{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;font-size:13px;background:var(--inset);user-select:none;transition:all .15s}
.chk input{accent-color:var(--cyan);width:16px;height:16px;flex:none}
.chk span{line-height:1.2;min-width:0}
.chk small{display:block;color:var(--dim);font-size:11px}
.chk:has(input:checked){border-color:var(--cyan);box-shadow:0 0 12px rgba(167,139,250,.22);background:rgba(167,139,250,.05)}

/* log + activity */
.log{padding:12px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0;padding-top:0}
.log-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.log p{margin:6px 0 8px;font-size:14px}
.log .by{font-size:12px;color:var(--muted)}
.seen{display:flex;flex-wrap:wrap;gap:5px}
.seen span{font:500 11px/1.3 var(--mono);padding:3px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--dim)}
.seen span.y{color:var(--acid);border-color:rgba(94,234,212,.35)}
.seen-count{font:700 12px var(--mono);color:var(--cyan)}
.act{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.act:first-of-type{border-top:0;padding-top:0}
.act .ico{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 14px var(--mono);color:#000}
.act .ico.confirm{background:var(--acid);box-shadow:0 0 12px rgba(94,234,212,.5)}
.act .ico.problem{background:var(--red);box-shadow:0 0 12px rgba(255,77,109,.5)}
.act .tx{flex:1;font-size:13.5px;min-width:0}
.act .tx b{font-weight:700}
.act .tm{font:500 11px var(--mono);color:var(--dim);display:block;margin-top:2px}
.act.clickable{cursor:pointer}
.act.clickable:hover .tx b{color:var(--cyan)}

/* ---------- Artist / supplier ---------- */
.mine{display:flex;flex-direction:column;gap:14px}
.gig-card{position:relative;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;transition:all .2s}
.gig-card:hover{border-color:var(--c,var(--mag));box-shadow:0 0 0 1px var(--c,var(--mag)),0 0 26px color-mix(in srgb,var(--c,var(--mag)) 30%,transparent)}
.gig-card .mid{flex:1;min-width:0}
.gig-card .nm{font-size:17px;font-weight:800;line-height:1.25}
.gig-card .vn{color:var(--muted);font-size:13px}
.gig-card .tm{font:700 14px var(--mono);color:var(--text);margin-top:6px}
.gig-card .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.newline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mag);font-weight:700}
.gig-hero{margin-top:6px;padding:22px;border-radius:24px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(255,122,107,.10),rgba(167,139,250,.05) 60%),var(--panel)}
.gig-hero.sup{background:linear-gradient(160deg,rgba(94,234,212,.08),rgba(167,139,250,.05) 60%),var(--panel)}
.gig-hero h1{font-size:clamp(24px,5vw,36px);font-weight:800;margin:10px 0 4px}
.bigtime{margin:18px 0;padding:16px;border-radius:16px;border:1px solid var(--line2);background:var(--inset);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.bigtime small{font:600 11px var(--sans);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.bigtime .t{font:700 clamp(30px,8vw,46px)/1 var(--mono);color:var(--cyan);text-shadow:0 0 18px rgba(167,139,250,.55)}
.gig-hero.sup .bigtime .t{color:var(--acid);text-shadow:0 0 18px rgba(94,234,212,.45)}
.statusbar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px;font-weight:600;border:1px solid}
.statusbar.ok{color:var(--acid);border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.06)}
.statusbar.wait{color:var(--amber);border-color:rgba(255,200,87,.4);background:rgba(255,200,87,.06)}
.statusbar.bad{color:#ffd0dc;border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.08)}
.statusbar .em{font-size:18px}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .l{font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.tile .v{font-size:15px;font-weight:600}
.tile .v.mono{font-size:17px}
.tile.wide{grid-column:span 2}
.callbtn{margin-top:10px}
.upd{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--inset);margin-bottom:8px}
.upd.new{border-color:rgba(255,122,107,.6);box-shadow:0 0 18px rgba(255,122,107,.22)}
.upd .h{display:flex;gap:8px;align-items:center;font:500 11.5px var(--mono);color:var(--muted)}
.upd p{margin:6px 0 0;font-size:15px;font-weight:500}
.eqtable{width:100%;border-collapse:collapse;font-size:14px}
.eqtable td{padding:9px 6px;border-top:1px solid var(--line)}
.eqtable tr:first-child td{border-top:0}
.eqtable .q{font:700 15px var(--mono);color:var(--acid);width:54px}
.eqtable tr.flag td{color:var(--red)}
.eqtable tr.flag .q{color:var(--red)}
.eqtable .st{text-align:right;width:110px}

/* ---------- Modal + toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fade .15s}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--red);border-radius:22px;padding:22px;box-shadow:0 0 40px rgba(255,77,109,.3)}
.modal h3{font-size:20px;font-weight:800}
.modal p.sub{color:var(--muted);margin:4px 0 16px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;padding:8px 12px;border:1px solid var(--line2);border-radius:999px;font-size:13px;cursor:pointer;transition:all .15s}
.opt input:checked + span{border-color:var(--red);color:#fff;background:rgba(255,77,109,.15);box-shadow:0 0 14px rgba(255,77,109,.35)}
.modal select{width:100%;background:var(--inset);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:10px;font:14px var(--sans);margin-bottom:12px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:var(--panel);border:1px solid var(--cyan);color:var(--text);padding:12px 16px;border-radius:14px;box-shadow:0 0 26px rgba(167,139,250,.35);font-size:14px;font-weight:600;animation:tin .25s ease;display:flex;gap:10px;align-items:center;width:100%}
.toast.ok{border-color:var(--acid);box-shadow:0 0 26px rgba(94,234,212,.3)}
.toast.bad{border-color:var(--red);box-shadow:0 0 26px rgba(255,77,109,.35)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.spacer{height:60px}

/* ---------- Logo ---------- */
.logo{display:inline-flex;align-items:center;gap:9px}
.truss-ic{color:var(--cyan);filter:drop-shadow(0 0 6px rgba(167,139,250,.7));flex:none}
.slogan{font:600 clamp(13px,2.4vw,17px)/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--text);margin-top:14px}

/* ---------- Landing (public website) ---------- */
.lp-nav{position:sticky;top:0;z-index:30;background:rgba(26,22,33,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.lp-nav-in{display:flex;align-items:center;gap:18px;height:64px}
.lp-links{display:flex;gap:4px;margin-left:auto}
.lp-links button,.lp-mobile button:not(.btn),.lp-foot-links button{background:none;border:0;color:var(--muted);font:600 14px var(--sans);padding:8px 10px;border-radius:8px;transition:color .15s}
.lp-links button:hover,.lp-mobile button:not(.btn):hover,.lp-foot-links button:hover{color:var(--cyan);text-shadow:0 0 10px rgba(167,139,250,.6)}
.lp-nav-r{display:flex;align-items:center;gap:10px}
.lp-burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lp-burger i{display:block;width:18px;height:2px;background:var(--text);border-radius:2px}
.lp-mobile{display:none;flex-direction:column;padding:8px 16px 16px;border-top:1px solid var(--line)}
.lp-mobile button:not(.btn){text-align:left;padding:12px 4px;font-size:16px;border-bottom:1px solid var(--line);border-radius:0}
.lp-nav.open .lp-mobile{display:flex}
.lp-eyebrow{font:700 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mag);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.lp-eyebrow::before{content:"";width:22px;height:2px;background:var(--mag);box-shadow:0 0 8px var(--mag)}
.grad{background:linear-gradient(90deg,var(--cyan),var(--mag) 60%,var(--acid));-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-hero{padding:56px 0 40px}
.lp-hero-in{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.lp-hero h1{font-size:clamp(40px,6.6vw,78px);line-height:1.02;font-weight:800;letter-spacing:-.03em}
.lp-hero .lead{font-size:clamp(16px,1.6vw,19px);color:var(--muted);margin:22px 0 28px;max-width:560px}
.lp-ctas{display:flex;gap:12px;flex-wrap:wrap}
.lp-big{padding:15px 24px;font-size:16px;border-radius:14px}
.lp-for{margin-top:26px;font-size:12px;color:var(--dim);letter-spacing:.04em}
.lp-truss{width:100%;height:auto;display:block}
.lp-truss .frame path{stroke:#d5dbe6;stroke-width:2;fill:none;opacity:.85;filter:drop-shadow(0 0 3px rgba(255,255,255,.25))}
.lp-truss .beam{transform-box:view-box;animation:sway 6s ease-in-out infinite alternate;transform:rotate(var(--r))}
@keyframes sway{from{transform:rotate(var(--r))}to{transform:rotate(calc(var(--r) * -1))}}
.lp-strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.lp-strip-in{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:26px 16px}
.lp-strip-in div{display:flex;flex-direction:column;gap:4px}
.lp-strip-in b{font-size:clamp(26px,3.4vw,38px);line-height:1;text-shadow:0 0 16px currentColor}
.lp-strip-in span{color:var(--muted);font-size:14px}
.lp-sec{padding:84px 0}
.lp-sec.alt{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0));border-top:1px solid var(--line)}
.lp-h2{font-size:clamp(32px,5vw,56px);line-height:1.05;font-weight:800;letter-spacing:-.025em;margin-bottom:18px}
.lp-intro{color:var(--muted);font-size:17px;max-width:640px;margin:0 0 36px}
.lp-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lp-card,.lp-feat,.lp-step,.lp-prof{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:24px;transition:border-color .2s,box-shadow .2s,transform .2s}
.lp-card:hover,.lp-feat:hover,.lp-step:hover{border-color:var(--cyan);box-shadow:0 0 26px rgba(167,139,250,.18);transform:translateY(-2px)}
.lp-card-k{font:700 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.lp-card-k.bad{color:var(--red);text-shadow:0 0 10px rgba(255,77,109,.5)}
.lp-card p,.lp-feat p,.lp-step p{margin:0;color:var(--muted);font-size:15px}
.lp-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.lp-num{font:700 15px var(--mono);color:var(--cyan);text-shadow:0 0 10px rgba(167,139,250,.6);margin-bottom:14px;display:block}
.lp-step h3{font-size:20px;margin-bottom:8px}
.lp-prof{--c:var(--cyan);display:flex;flex-direction:column;gap:16px;border-top:3px solid var(--c)}
.lp-prof.artist{--c:var(--mag)} .lp-prof.supplier{--c:var(--acid)}
.lp-prof .lp-num{color:var(--c);text-shadow:0 0 10px var(--c);margin:0}
.lp-prof:hover{border-color:var(--c);box-shadow:0 0 30px color-mix(in srgb,var(--c) 25%,transparent);transform:translateY(-2px)}
.lp-prof-hd{display:flex;align-items:center;gap:12px}
.lp-prof-hd h3{font-size:22px;color:var(--c)}
.lp-prof-hd small{color:var(--muted);font-size:13px}
.lp-prof ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;flex:1}
.lp-prof li{display:flex;gap:10px;font-size:15px}
.lp-prof li::before{content:"✓";color:var(--c);font-weight:700;font-family:var(--mono)}
.lp-feat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 20px var(--mono);color:var(--cyan);border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.07);box-shadow:0 0 16px rgba(167,139,250,.18);margin-bottom:16px}
.lp-feat:nth-child(3n+2) .ic{color:var(--mag);border-color:rgba(255,122,107,.4);background:rgba(255,122,107,.07);box-shadow:0 0 16px rgba(255,122,107,.18)}
.lp-feat:nth-child(3n) .ic{color:var(--acid);border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.07);box-shadow:0 0 16px rgba(94,234,212,.15)}
.lp-feat h4{margin:0 0 6px;font-size:18px}
.lp-about{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.lp-why{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.lp-why div{display:flex;gap:16px;align-items:baseline;padding:16px 18px;border:1px solid var(--line2);border-radius:16px;background:var(--panel)}
.lp-why .lp-num{margin:0}
.lp-why p{margin:0;font-size:17px;color:var(--muted)}
.lp-why b{color:var(--text)}
.lp-quote{padding:36px;border-radius:24px;border:1px solid var(--mag);background:linear-gradient(150deg,rgba(255,122,107,.14),rgba(167,139,250,.08));box-shadow:0 0 40px rgba(255,122,107,.2)}
.lp-quote .mono{font-size:15px;letter-spacing:.2em;color:var(--mag);font-weight:700}
.lp-quote .q{font-size:clamp(28px,3.6vw,42px);font-weight:800;line-height:1.1;margin:12px 0 18px;letter-spacing:-.02em}
.lp-quote p{margin:0;color:var(--muted)}
.lp-contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.lp-form{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:8px}
.lp-form label{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lp-form input{background:var(--inset);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;color:var(--text);font:15px var(--sans);margin-bottom:8px;outline:none}
.lp-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(167,139,250,.15)}
.lp-form small{color:var(--dim);text-align:center;margin-top:4px}
.lp-foot{border-top:1px solid var(--line);padding:36px 0 44px}
.lp-foot-in{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.lp-foot .logo{font:800 18px/1 var(--sans);letter-spacing:.18em;color:var(--text)}
.lp-foot-links{display:flex;flex-wrap:wrap;gap:2px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
.lp-grid3 .reveal:nth-child(2),.lp-steps .reveal:nth-child(2){transition-delay:.08s}
.lp-grid3 .reveal:nth-child(3),.lp-steps .reveal:nth-child(3){transition-delay:.16s}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.lp-truss .beam{animation:none}}
.login{min-height:calc(100vh - 65px)}

@media (max-width:1060px){ .lp-links{display:none} .lp-burger{display:flex} .lp-nav-r{margin-left:auto} }
@media (max-width:900px){
  .lp-hero-in,.lp-about,.lp-contact{grid-template-columns:1fr}
  .lp-hero{padding-top:36px}
  .lp-grid3,.lp-steps{grid-template-columns:1fr}
  .lp-strip-in{grid-template-columns:1fr 1fr}
  .lp-sec{padding:60px 0}
}

/* =========================================================
   ARTISTIC DIRECTION: "Night show"
   warm espresso background · cream type · ONE accent (peach)
   bold Manrope headlines · real concert photography · no glow
   status colours (green / amber / red) only where they carry meaning
   Photos: Unsplash (free licence), loaded online; colours fall back offline.
   ========================================================= */
:root{
  --bg:#1a120c; --panel:#251a12; --inset:#1f160f; --panel2:#2e2118;
  --line:#3a2b20; --line2:#4d3a2c;
  --text:#f6ecdc; --muted:#d6c6b0; --dim:#a8957d;
  --accent:#f2a97e; --accent-ink:#2a160a; --accent-soft:rgba(242,169,126,.12);
  --cyan:var(--accent); --mag:var(--accent);
  --acid:#8fd6a5; --amber:#f2c86d; --red:#f08473;
  --head:'Manrope',var(--sans);
  --shadow:0 12px 34px rgba(0,0,0,.28);
}
body::before{display:none}
*,*::before,*::after{text-shadow:none !important}
*:not(input):not(textarea):not(select){box-shadow:none !important}
svg,.ring,.truss-ic,.brand-big{filter:none !important}
.top::after{background:var(--line);opacity:1}
.top,.lp-nav{background:rgba(26,18,12,.86)}
.lp-nav{border-bottom-color:rgba(255,255,255,.06)}

/* headings */
.lp-hero h1,.lp-h2,.hello h1,.ev-hero h1,.gig-hero h1,.lp-quote .q,.brand-big,.lp-stage h3,.role-card .rname,.lp-step h3,.lp-prof-hd h3,.lp-feat h4,.logo .wm{font-family:var(--head);font-weight:800;letter-spacing:-.02em}
.logo .wm{letter-spacing:.14em}
.grad{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--accent)}
.brand-big{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--text);letter-spacing:.12em}
.slogan{color:var(--muted);letter-spacing:.16em;font-size:13px;font-family:var(--sans)}
.lp-eyebrow{color:var(--accent);font-family:var(--head);letter-spacing:.2em;font-size:12px}
.lp-eyebrow::before{background:var(--accent);height:1px}

/* buttons, badges */
.badge,.newtag{animation:none;background:var(--accent);color:var(--accent-ink)}
.btn{background:transparent;font-weight:700}
.btn:hover{background:var(--accent-soft)}
.btn.solid,.btn.red.solid{color:var(--accent-ink)}
.btn.solid:hover{filter:brightness(1.06);background:var(--c)}
.btn.acid.solid{color:#10301c}
.btn.red.solid{color:#3a0d07}
.btn.ghost{--c:var(--line2);color:var(--text)}
.btn.ghost:hover{background:var(--panel2)}
.btn.red{--c:var(--red)}
.logo i,.truss-ic{color:var(--accent)}
.av,.av.promoter,.av.artist,.av.supplier{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
.rolebar button.on.promoter,.rolebar button.on.artist,.rolebar button.on.supplier{background:var(--accent);color:var(--accent-ink)}

/* cards */
.card,.party,.ev-card,.gig-card,.role-card,.stat,.tile,.lp-card,.lp-feat,.lp-step,.lp-prof,.lp-form,.ev-hero,.gig-hero{box-shadow:var(--shadow) !important}
.role-card,.role-card.artist,.role-card.supplier,.lp-prof,.lp-prof.artist,.lp-prof.supplier{--c:var(--accent)}
.role-card .rname,.lp-prof-hd h3{color:var(--text)}
.role-card:hover,.ev-card:hover,.gig-card:hover,.lp-card:hover,.lp-feat:hover,.lp-step:hover,.lp-prof:hover{border-color:var(--accent);transform:translateY(-2px)}
.lp-prof{border-top:1px solid var(--line2)}
.lp-prof li::before{color:var(--accent)}
.lp-feat .ic,.lp-feat:nth-child(3n+2) .ic,.lp-feat:nth-child(3n) .ic{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.lp-num,.lp-prof .lp-num{color:var(--accent)}
.ev-hero,.gig-hero,.gig-hero.sup{background:var(--panel)}
.dateblock{background:var(--inset)}
.dateblock .d,.gig-hero.sup .bigtime .t,.bigtime .t{color:var(--text)}
.ptype,.tag,.tag.mag,.tag.acid{color:var(--muted);border-color:var(--line2)}
.items .q,.eqtable .q,.seen-count{color:var(--accent)}
.party.flash{animation:flash2 2.4s ease-out}
@keyframes flash2{0%,40%{outline:2px solid var(--accent);outline-offset:2px}100%{outline:2px solid transparent;outline-offset:2px}}
.party.ok{border-color:var(--line)}
.party.bad,.oi.bad{border-color:rgba(240,132,115,.5)}
.chk input{accent-color:var(--accent)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.upd.new{border-color:var(--accent)}
.oi p{color:var(--muted)}

/* status */
.pill.ok{color:var(--acid);background:rgba(143,214,165,.1) !important;border-color:rgba(143,214,165,.35) !important}
.pill.wait{color:var(--amber);background:rgba(242,200,109,.1) !important;border-color:rgba(242,200,109,.35) !important}
.pill.bad{color:var(--red);background:rgba(240,132,115,.1) !important;border-color:rgba(240,132,115,.4) !important}
.issue.bad,.statusbar.bad{color:#ffd6cd;border-color:rgba(240,132,115,.4);background:rgba(240,132,115,.09)}
.issue.wait,.statusbar.wait{color:#f9e2ad;border-color:rgba(242,200,109,.35);background:rgba(242,200,109,.07)}
.statusbar.ok{color:var(--acid);border-color:rgba(143,214,165,.35);background:rgba(143,214,165,.08)}
.act .ico.confirm{background:var(--acid);color:#10301c} .act .ico.problem{background:var(--red);color:#3a0d07}

/* modal, toast */
.modal-bg{background:rgba(10,6,3,.6)}
.modal{border-color:var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.45) !important}
.opt input:checked + span{border-color:var(--red);background:rgba(240,132,115,.14);color:var(--text);font-weight:600}
.toast,.toast.ok,.toast.bad{background:var(--panel2);border-color:var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.4) !important}
.toast.ok{border-left:4px solid var(--acid)} .toast.bad{border-left:4px solid var(--red)}

/* ---------- Landing ---------- */
.lp-hero{
  min-height:calc(100vh - 64px);display:flex;align-items:center;padding:80px 0;
  background:
    linear-gradient(90deg,rgba(22,13,7,.95) 0%,rgba(22,13,7,.72) 45%,rgba(22,13,7,.2) 100%),
    url(https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=2000&q=75) center/cover,
    var(--bg);
}
.lp-hero-in{display:block;width:100%}
.lp-hero-txt{max-width:700px}
.lp-hero h1{font-size:clamp(46px,7vw,92px);line-height:1}
.lp-hero .lead{color:#e8dac6}
.lp-genres span{background:rgba(26,18,12,.55);border-color:rgba(246,236,220,.22);color:#efe2cf;backdrop-filter:blur(4px)}
.lp-for{color:#c9b8a0}
.lp-h2{font-size:clamp(36px,5vw,62px);line-height:1.02}
.lp-strip{background:var(--bg)}
.lp-strip-in b{color:var(--accent) !important}
.lp-sec.alt{background:var(--panel);border-color:var(--line)}
.lp-foot{background:var(--bg)}

/* app preview section */
.lp-demo-in{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
.pv-phone{background:var(--bg);box-shadow:0 30px 70px rgba(0,0,0,.45) !important}
.pv-card{box-shadow:0 24px 60px rgba(0,0,0,.4) !important}
.pv-toast{background:var(--panel2);box-shadow:0 14px 40px rgba(0,0,0,.4) !important}
.pv-btn{background:var(--accent);color:var(--accent-ink)}

/* "made for every stage" with photos */
.lp-stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lp-stage{background:var(--bg);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow) !important;transition:transform .25s}
.lp-stage:hover{transform:translateY(-4px)}
.lp-stage .ph{height:190px;background:var(--panel2) center/cover;transition:transform .5s}
.lp-stage:hover .ph{transform:scale(1.04)}
.lp-stage .bd{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1;position:relative;background:var(--bg)}
.lp-stage .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;font-family:var(--head)}
.lp-stage h3{font-size:24px;line-height:1.1}
.lp-stage p{margin:0;color:var(--muted);font-size:14.5px}
.lp-stage .ok{margin-top:auto;padding-top:6px;font-size:13px;color:var(--acid);font-weight:600}
@media (max-width:1000px){ .lp-stages{grid-template-columns:1fr 1fr} .lp-demo-in{grid-template-columns:1fr} }
@media (max-width:560px){ .lp-stages{grid-template-columns:1fr} }

/* about: slogan card on a photo */
.lp-quote{border:0 !important;color:var(--text);
  background:linear-gradient(180deg,rgba(22,13,7,.35),rgba(22,13,7,.92)),url(https://images.unsplash.com/photo-1429962714451-bb934ecdc4ec?w=1200&q=75) center/cover,var(--panel2) !important;
  min-height:380px;display:flex;flex-direction:column;justify-content:flex-end}
.lp-quote .mono{color:var(--accent) !important}
.lp-quote .q{color:#fff;font-size:clamp(32px,4vw,48px)}
.lp-quote p{color:#e8dac6 !important}

/* login screen on a photo */
.login{background:linear-gradient(180deg,rgba(22,13,7,.82),rgba(22,13,7,.95)),url(https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=2000&q=70) center/cover,var(--bg)}
.lp-genres{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.lp-genres span{padding:7px 13px;border-radius:999px;border:1px solid;font-size:13px}

/* ---------- Landing: app preview (replaces the stage drawing) ---------- */
.lp-preview{position:relative;min-height:500px}
.pv-phone{position:absolute;right:0;top:0;width:250px;border:1px solid var(--line2);border-radius:34px;background:var(--bg);padding:12px;z-index:2}
.pv-phone::before{content:"";display:block;width:70px;height:5px;border-radius:3px;background:var(--line2);margin:2px auto 12px}
.pv-screen{display:flex;flex-direction:column;gap:10px}
.pv-small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.pv-title{font-size:18px;font-weight:800;line-height:1.2}
.pv-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pv-time{font:700 24px/1.1 var(--mono);margin-top:2px}
.pv-btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px;text-align:center;font-weight:700;font-size:14px}
.pv-upd{border:1px solid var(--accent);border-radius:12px;padding:9px 11px;font-size:13px}
.pv-upd b{display:block;font-size:10px;letter-spacing:.1em;color:var(--accent);margin-bottom:2px}
.pv-card{position:absolute;left:0;top:56px;width:calc(100% - 276px);max-width:310px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:16px;z-index:3}
.pv-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.pv-row:first-of-type{border-top:0}
.pv-row small{display:block;color:var(--dim);font-size:11px}
.pv-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pv-head .ring{width:56px;height:56px} .pv-head .ring::before{inset:6px;background:var(--panel)} .pv-head .ring span{font-size:14px}
.pv-toast{position:absolute;left:0;bottom:0;z-index:4;background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--acid);border-radius:14px;padding:11px 14px;font-size:13px;font-weight:600;max-width:290px}
.ring::before{background:var(--panel)}
@media (max-width:1100px){
  .lp-hero-in{grid-template-columns:1fr}
  .lp-preview{min-height:0;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}
  .pv-phone,.pv-card,.pv-toast{position:static}
  .pv-card{width:320px;max-width:100%}
  .pv-toast{max-width:none;width:100%;text-align:center}
}
@media (max-width:600px){ .pv-phone,.pv-card{width:100%;max-width:340px} }

/* ---------- Stencil logo ---------- */
.logo-img{height:30px;width:auto;display:block}
.lp-foot .logo-img{height:34px}
.brand-img{width:min(560px,86vw);height:auto;display:block;margin:0 auto}
@media (max-width:420px){ .logo-img{height:20px} }

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .ev-cards{grid-template-columns:1fr 1fr}
  .ev-grid{grid-template-columns:1fr}
  .side{order:-1}
  .two{grid-template-columns:1fr}
}
@media (max-width:760px){
  .role-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .ev-cards{grid-template-columns:1fr}
  .parties{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .who{display:none}
  .rolebar .lbl{display:none}
  .bell{display:none}
  .top-in{gap:8px}
  .top-right{gap:8px}
  .rolebar button{padding:6px 9px}
  .logo{font-size:14px;letter-spacing:.1em}
  .top .btn.sm{padding:7px 10px}
  .top .btn.sm .full-lbl{display:none}
  .actions{grid-template-columns:1fr}
}
@media (max-width:420px){
  .checks{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .tile.wide{grid-column:auto}
  .logo{font-size:13px;letter-spacing:.08em}
  .gig-card{flex-wrap:wrap}
  .gig-card .right{flex-direction:row;width:100%;justify-content:space-between;align-items:center}
}
</style>
</head>

/* ---------------- helpers ---------------- */
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dparts(ds){ const x = new Date(ds+'T12:00:00'); return { dow:DAYS[x.getDay()], day:x.getDate(), mon:MONTHS[x.getMonth()], year:x.getFullYear() }; }
function fmtDate(ds){ const p = dparts(ds); return `${p.dow} ${p.day} ${p.mon} ${p.year}`; }
function fmtShort(ds){ const p = dparts(ds); return `${p.dow} ${p.day} ${p.mon}`; }
function daysUntil(ds){ return Math.round((new Date(ds+'T12:00:00') - DEMO_TODAY)/864e5); }
function nowStr(){ const n = new Date(); return 'Today · ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); }
function findEvent(id){ return EVENTS.find(e => e.id === id); }
function findParty(id){ for (const e of EVENTS){ const p = e.parties.find(x => x.id === id); if (p) return { e, p }; } return {}; }
function partyName(e,id){ const p = e.parties.find(x => x.id === id); return p ? p.name : id; }
function readiness(e){ return Math.round(e.parties.filter(p => p.status === 'confirmed').length / e.parties.length * 100); }
function countStatus(e,s){ return e.parties.filter(p => p.status === s).length; }
function ringColor(r){ return r >= 80 ? 'var(--acid)' : r >= 50 ? 'var(--cyan)' : 'var(--mag)'; }
function ring(r, big){ return `<div class="ring ${big?'big':''}" style="--p:${r};--c:${ringColor(r)}" title="Readiness: % of parties confirmed"><span>${r}%</span></div>`; }
function pill(status){ const s = STATUS[status]; return `<span class="pill ${s.cls}">${s.label}</span>`; }
function unreadUpdates(e,p){ return e.updates.filter(u => u.affects.includes(p.id) && !u.seenBy[p.id]); }
function myParties(role){ const out = []; EVENTS.forEach(e => e.parties.forEach(p => { if (p.user === role) out.push({ e, p }); })); return out.sort((a,b) => a.e.date.localeCompare(b.e.date)); }
function roleUnread(role){
  if (role === 'promoter') return EVENTS.reduce((n,e) => n + e.activity.filter(a => !a.read).length, 0);
  return myParties(role).reduce((n,x) => n + unreadUpdates(x.e, x.p).length, 0);
}
function openItems(events){
  const items = [];
  events.forEach(e => e.parties.forEach(p => { if (p.status !== 'confirmed') items.push({ e, p }); }));
  return items.sort((a,b) =>
    (a.p.status === 'problem' ? 0 : 1) - (b.p.status === 'problem' ? 0 : 1) ||
    daysUntil(a.p.due || a.e.date) - daysUntil(b.p.due || b.e.date));
}
function dueLabel(p,e){
  const ds = p.due || e.date, n = daysUntil(ds);
  if (n < 0) return { txt:`Overdue by ${-n} day${n===-1?'':'s'} · was due ${fmtShort(ds)}`, urgent:true };
  if (n === 0) return { txt:'Due today', urgent:true };
  if (n === 1) return { txt:'Due tomorrow · ' + fmtShort(ds), urgent:true };
  return { txt:`Due in ${n} days · ${fmtShort(ds)}`, urgent:n <= 3 };
}
function agreed(p){
  if (p.type === 'artist') return [ ['Set time',p.setTime], ['Stage',p.stage], ['Fee',p.fee], ['Arrival',p.arrival] ];
  if (p.type === 'supplier') return [ ['Load-in',p.loadIn], ['Soundcheck',p.soundcheck], ['Load-out',p.loadOut], ['Fee',p.fee] ];
  return p.info || [];
}
function daysToGo(e){ const n = daysUntil(e.date); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`; }

function initReveal(){
  const els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold:.12 });
  els.forEach(e => io.observe(e));
}

function openList(items, showEvent){
  if (!items.length) return '<div class="empty">Nothing open — everything is confirmed ✓</div>';
  return `<ol class="oi-list">${items.map(({e,p},i) => {
    const s = STATUS[p.status], due = dueLabel(p,e);
    return `<li class="oi ${s.cls}">
      <span class="rank">${String(i+1).padStart(2,'0')}</span>
      <div class="body">
        <div class="t">${esc(p.name)}<small>${TYPE_LABEL[p.type]}${showEvent?' · '+esc(e.name):''}</small></div>
        <p>${esc(p.issue || 'Waiting for confirmation.')}</p>

}

function activityRow(e,a,showEvent){

      <span class="mono">${affecting.length ? `updates seen ${seen}/${affecting.length}` : 'no updates yet'}</span>

  const mine = e.updates.filter(u => u.affects.includes(p.id));

  return mine.map(u => `<div class="upd ${u.seenBy[p.id]?'':'new'}">
    <div class="h">${u.seenBy[p.id]?'':'<span class="newtag">NEW</span>'}<span>${esc(u.time)} · from Lotte (promoter)</span></div>
    <p>${esc(u.text)}</p></div>`).join('');
}

function statusBar(p, isA){
  if (p.status === 'confirmed') return `<div class="statusbar ok"><span class="em">✓</span>You confirmed this ${isA?'gig':'job'}. The promoter can see it.</div>`;
  if (p.status === 'problem') return `<div class="statusbar bad"><span class="em">⚠</span><span>Problem reported: ${esc(p.issue)}</span></div>`;
  return `<div class="statusbar wait"><span class="em">…</span>The promoter is waiting for your confirmation${p.due?` (by ${fmtShort(p.due)})`:''}.</div>`;
}

      <div class="tile"><div class="l">Agreed fee</div><div class="v mono">${esc(p.fee)}</div></div>
    </div>
    <div class="spacer"></div>
  </main>`;
}

/* ---------------- render ---------------- */
function render(){
  const app = $('#app');
  if (!S.role){
    app.innerHTML = S.page === 'login' ? loginView() : landingView();
    initReveal();
    return;
  }
  let body = '';
  const after = [];
  if (S.role === 'promoter'){
    if (S.screen === 'event'){
      const e = findEvent(S.id);
      body = promoterEvent(e);
      after.push(() => { e.activity.forEach(a => a.read = true); e.parties.forEach(p => p.flash = false); });
    } else body = promoterHome();
  } else {
    if (S.screen === 'mine'){
      const { e, p } = findParty(S.id);
      body = S.role === 'artist' ? artistGig(e,p) : supplierJob(e,p);
      // opening the gig/job counts as "seen" for all updates concerning this party
      after.push(() => { const t = nowStr(); unreadUpdates(e,p).forEach(u => u.seenBy[p.id] = t); });
    } else body = myHome(S.role);
  }
  after.forEach(f => f());          // mark as seen/read AFTER building the body (so NEW tags still show once)…
  app.innerHTML = header() + body;  // …but BEFORE the header, so its badge counts are already up to date
}

function go(screen, id){ S.screen = screen; S.id = id || null; render(); window.scrollTo({ top:0 }); }

/* ---------------- toast & modal ---------------- */
function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = msg;
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }, 3200);
  setTimeout(() => el.remove(), 3700);
}

function openProblemModal(pid){
  const { p } = findParty(pid);
  const isSup = p.type === 'supplier';
  const opts = isSup
    ? ['Item unavailable','Load-in time not possible','Crew / vehicle issue','Price change','Other']
    : ['I can’t make it','Travel delay','Set time conflict','Rider issue','Other'];
  $('#modal').innerHTML = `<div class="modal-bg" data-act="close-modal">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>⚠ ${isSup?'Flag a problem':'Report a problem'}</h3>
      <p class="sub">Lotte (promoter) sees this immediately in her event overview.</p>
      <div class="opts">${opts.map((o,i) => `<label class="opt"><input type="radio" name="ptype" value="${esc(o)}" ${i===0?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>
      ${isSup ? `<select id="prob-item"><option value="">Which item? (optional)</option>${p.equipment.map((q,i)=>`<option value="${i}">${q.qty}× ${esc(q.item)}</option>`).join('')}</select>` : ''}
      <textarea id="prob-text" placeholder="${isSup?'e.g. Only 3 CDJ-3000s available that weekend — can offer a CDJ-2000NXS2 as 4th.':'e.g. My train is cancelled, I’ll arrive around 01:00.'}"></textarea>
      <div class="row">
        <button class="btn ghost" data-act="close-modal">Cancel</button>
        <button class="btn red solid" data-act="submit-problem" data-id="${pid}">Send to promoter</button>
      </div>
    </div></div>`;
  setTimeout(() => $('#prob-text') && $('#prob-text').focus(), 50);
}
function closeModal(){ $('#modal').innerHTML = ''; }

/* ---------------- actions ---------------- */
const ACTIONS = {
  login(id){ S.role = id; go('home'); },
  switch(){ S.role = null; S.page = 'login'; S.screen = 'home'; render(); window.scrollTo({ top:0 }); },
  'to-login'(){ S.role = null; S.page = 'login'; render(); window.scrollTo({ top:0 }); },
  'to-landing'(){ S.role = null; S.page = 'landing'; render(); window.scrollTo({ top:0 }); },
  menu(){ document.querySelector('.lp-nav').classList.toggle('open'); },
  nav(id){
    if (S.page !== 'landing'){ S.page = 'landing'; render(); }
    const nav = document.querySelector('.lp-nav'); if (nav) nav.classList.remove('open');
    const el = document.getElementById('sec-' + id);
    if (!el || id === 'home') { window.scrollTo({ top:0, behavior:'smooth' }); return; }
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior:'smooth' });
  },
  waitlist(){
    const n = $('#wl-name').value.trim();
    toast(`🙌 Thanks${n ? ' ' + esc(n) : ''}! (Prototype — nothing was sent.) Try the demo via “Log in”.`, 'ok');
    $('#wl-name').value = ''; $('#wl-org').value = '';
  },
  reset(){ location.reload(); },
  home(){ go('home'); },
  'open-event'(id){ go('event', id); },
  'open-mine'(id){ go('mine', id); },
  jump(id){
    const { e } = findParty(id);
    if (S.screen !== 'event' || S.id !== e.id) go('event', e.id);
    const el = document.getElementById('pc-' + id);
    if (el){
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  },
  tpl(i){
    const e = findEvent(S.id), t = e.templates[+i];
    $('#upd-text').value = t.t;
    document.querySelectorAll('input[name=aff]').forEach(cb => cb.checked = t.sel.includes(cb.value));
  },
  selall(){
    const cbs = [...document.querySelectorAll('input[name=aff]')];
    const all = cbs.every(c => c.checked);
    cbs.forEach(c => c.checked = !all);
  },
  post(eid){
    const e = findEvent(eid);
    const text = $('#upd-text').value.trim();
    const affects = [...document.querySelectorAll('input[name=aff]:checked')].map(c => c.value);
    if (!text){ toast('✎ Write the change first (or tap a suggestion).', 'bad'); $('#upd-text').focus(); return; }
    if (!affects.length){ toast('☐ Select at least one party this affects.', 'bad'); return; }
    e.updates.unshift({ id:'u'+Date.now(), text, time:nowStr(), affects, seenBy:{} });
    render();
    toast(`📣 Update sent to ${affects.length} part${affects.length>1?'ies':'y'} — they get a notification in their own view.`, 'ok');
  },
  confirm(pid){
    const { e, p } = findParty(pid);
    p.status = 'confirmed'; p.issue = null; p.flash = true;
    if (p.equipment) p.equipment.forEach(q => q.flag = false);
    e.activity.unshift({ partyId:pid, kind:'confirm', text: p.type==='supplier' ? 'confirmed the job and equipment list.' : 'confirmed they’ll be there.', time:nowStr(), read:false });
    render();
    toast(`✓ Confirmed! ${USERS.promoter.first} (promoter) sees this right away.`, 'ok');
  },
  problem(pid){ openProblemModal(pid); },
  'close-modal'(){ closeModal(); },
  'submit-problem'(pid){
    const { e, p } = findParty(pid);
    const kind = (document.querySelector('input[name=ptype]:checked') || {}).value || 'Problem';
    const details = $('#prob-text').value.trim();
    const itemSel = $('#prob-item');
    let itemTxt = '';
    if (itemSel && itemSel.value !== ''){ const q = p.equipment[+itemSel.value]; q.flag = true; itemTxt = `${q.qty}× ${q.item}`; }
    const text = kind + (itemTxt ? ': ' + itemTxt : '') + (details ? ' — ' + details : '');
    p.status = 'problem'; p.issue = text; p.flash = true;
    e.activity.unshift({ partyId:pid, kind:'problem', text:'reported a problem: ' + text, time:nowStr(), read:false });
    closeModal(); render();
    toast(`⚠ Sent to ${USERS.promoter.first}. The promoter’s view is updated.`, 'bad');
  }
};

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  // clicks inside the modal shouldn't close it (only the backdrop itself)
  if (a === 'close-modal' && t.classList.contains('modal-bg') && ev.target !== t) return;
  if (ACTIONS[a]){ ev.preventDefault(); ACTIONS[a](t.dataset.id, t, ev); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.change === 'status' && t.value){
    const { p } = findParty(t.dataset.id);
    p.status = t.value;
    if (t.value === 'confirmed'){ p.issue = null; if (p.equipment) p.equipment.forEach(q => q.flag = false); }
    else if (!p.issue) p.issue = t.value === 'problem' ? 'Marked as a problem by the promoter.' : 'Waiting for confirmation.';
    render();
    toast(`Status of ${esc(p.name)} set to ${STATUS[t.value].label}.`);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

render();
</script>
</body>
</html>
